[project]
name = "lerning-langchain"
version = "0.1.0"
description = "Project for learning LangChain"
authors = [
    {name = "MacBachi",email = "mac@bachi.at"}
]
license = {text = "WTFPLv2"}
readme = "README.md"
requires-python = ">=3.13, <4.0"
dependencies = [
    "openai (>=2.6.1,<3.0.0)",
    "langchain-openai (>=1.0.1,<2.0.0)",
    "langchain-core (>=1.0.1,<2.0.0)",
    "langchain-community (>=0.4.1,<0.5.0)",
    "pypdf (>=6.1.3,<7.0.0)",
    "chromadb (>=1.3.0,<2.0.0)",
    "langchain-text-splitters (>=1.0.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
